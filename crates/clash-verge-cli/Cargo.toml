[package]
name = "clash-verge-cli"
version = "2.4.8"
edition = "2024"
rust-version = "1.91"
description = "CLI tool for controlling Clash Verge TUN mode and system proxy"
authors = ["zzzgydi", "Tunglies", "wonfen", "MystiPanda"]
license = "GPL-3.0-only"

[[bin]]
name = "cvr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
smartstring = { version = "1.0", features = ["serde"] }
sysproxy = { git = "https://github.com/clash-verge-rev/sysproxy-rs", branch = "0.5.3" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["json"] }
colored = "3.0"

[lints]
workspace = true
